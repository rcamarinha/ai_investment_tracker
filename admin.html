<html lang="en">
<head>

<body>

    <div id="appNavbar" class="app-navbar"></div>

    <div class="container">

        <div class="header">
            <div class="header-eyebrow">Administration</div>
            <h1>
                <span>Admin</span>
                <span class="header-version">v3.55.1</span>
            </h1>
            <p>Who uses the app, and invitations</p>
        </div>

        <!-- Rendered by services/admin.js. Nothing is decided here: invitations

    </div>

    <nav class="bottom-nav">
        <a href="index.html"     class="bn-item"><span class="bn-icon">⊞</span>Hub</a>

    <script type="module">
        import { installErrorReporting } from './services/telemetry.js';
        installErrorReporting({ page: 'admin', version: '3.55.1' });
        // services/ is never imported with ?v= — it revalidates by header, and a
        // versioned URL would create a second copy of every shared module.
        import { renderNavbar } from './services/navbar.js';
        import { initAdminPage } from './services/admin.js';

        renderNavbar({ supabaseConfigured: true });
        initAdminPage();
    </script>
